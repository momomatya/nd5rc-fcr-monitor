name: ND Roadster FCR Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 定期巡回と手動巡回が重なった場合、古い方を止めて競合を防ぐ
concurrency:
  group: nd5rc-fcr-monitor-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitoring script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          python src/monitor.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          cp data/vehicles.json /tmp/vehicles_latest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/vehicles_latest.json data/vehicles.json
          git add data/vehicles.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(monitor): update detected vehicles [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
