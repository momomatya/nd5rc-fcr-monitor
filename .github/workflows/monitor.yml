name: ND Roadster FCR Monitor

on:
  schedule:
    # デフォルト: 15分間隔（コントロールパネルから動的に書き換え可能）
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitoring script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          python src/monitor.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/vehicles.json
          if git diff --staged --quiet; then
            echo "新規検出車両はありません。コミットをスキップします。"
          else
            git commit -m "chore(data): update detected ND5RC vehicles [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
